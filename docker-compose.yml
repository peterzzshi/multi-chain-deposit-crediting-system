services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deposit_crediting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deposit_crediting"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      args:
        SERVICE: migrate
    image: multi-chain-deposit-crediting-system-migrate:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/deposit_crediting?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  chain-node:
    build:
      context: .
      args:
        SERVICE: chain-node
    image: multi-chain-deposit-crediting-system-chain-node:latest
    environment:
      LISTEN_ADDR: :9100
    ports:
      - "9100:9100"

  custodian-api:
    build:
      context: .
      args:
        SERVICE: custodian-api
    image: multi-chain-deposit-crediting-system-custodian-api:latest
    environment:
      LISTEN_ADDR: :9300
    ports:
      - "9300:9300"

  server:
    build:
      context: .
      args:
        SERVICE: server
    image: multi-chain-deposit-crediting-system-server:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/deposit_crediting?sslmode=disable
      CHAINS_CONFIG: /configs/chains.json
      ASSETS_CONFIG: /configs/assets.json
      LISTEN_ADDR: :9200
      PROVIDER: custodianA
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      chain-node:
        condition: service_started
    ports:
      - "9200:9200"

  scanner:
    build:
      context: .
      args:
        SERVICE: scanner
    image: multi-chain-deposit-crediting-system-scanner:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/deposit_crediting?sslmode=disable
      CHAINS_CONFIG: /configs/chains.json
      ASSETS_CONFIG: /configs/assets.json
      START_HEIGHT: "0"
      MAX_BATCH: "100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      chain-node:
        condition: service_started

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    image: multi-chain-deposit-crediting-system-worker:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/deposit_crediting?sslmode=disable
      CUSTODIAN_API_URL: http://custodian-api:9300
      PROVIDER: custodianA
      CHAINS_CONFIG: /configs/chains.json
      ASSETS_CONFIG: /configs/assets.json
      RECONCILE_INTERVAL_MS: 30000
      RECONCILE_OVERLAP_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      chain-node:
        condition: service_started
      custodian-api:
        condition: service_started

volumes:
  pgdata:
